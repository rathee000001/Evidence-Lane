[package]
name = "evidence-os-clean-desktop"
version = "0.1.1"
description = "Evidence Lane SQLite Builder clean desktop app"
authors = ["Evidence Lane"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[features]
default = []
embedded-worker = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
